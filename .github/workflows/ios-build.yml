
name: Build ROBO iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild \
            -project ROBOiOS.xcodeproj \
            -scheme ROBOiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ROBOiOS.app Payload/
          zip -r ROBOiOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ROBOiOS-unsigned-IPA
          path: ROBOiOS-unsigned.ipa
