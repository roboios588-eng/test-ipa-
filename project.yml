name: ROBOiOS
options:
  bundleIdPrefix: com.roboios
  deploymentTarget:
    iOS: "16.0"
targets:
  ROBOiOS:
    type: application
    platform: iOS
    sources:
      - path: ROBOiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roboios.app
        PRODUCT_NAME: ROBOiOS
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ROBO iOS
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
